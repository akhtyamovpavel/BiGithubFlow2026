[tool.poetry]
name = "schedule-service"
version = "0.1.0"
description = "Schedule Planning Service (ScheduleService)"
authors = ["Team Lead <teamlead@example.com>"]
readme = "README.md"
packages = [{include = "schedule_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
