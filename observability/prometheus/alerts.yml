groups:
  - name: schedule-service-alerts
    interval: 15s
    rules:
      - alert: ServiceTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} ({{ $labels.job }}) has been unreachable for 1m."

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance is unavailable"
          description: "postgres-exporter reports pg_up == 0 for 1m."

      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx frontend proxy is unavailable"
          description: "nginx-exporter reports nginx_up == 0 for 1m."

      - alert: HighHttp5xxErrorRate
        expr: >-
          (
            sum(rate(http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate above 5%"
          description: "5xx error share exceeded 5% over a 5m window for 2m."

      - alert: HighHttpP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency above 500ms"
          description: "FastAPI p95 request duration exceeded 0.5s over a 5m window for 3m."
