services:
  postgres:
    image: postgres:16-alpine
    container_name: schedule_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-schedule_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-schedule_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schedule_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=${APP_NAME:-ScheduleService}
      - VERSION=${VERSION:-0.1.0}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-schedule_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-schedule_db}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - default
      - monitoring

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/stub_status >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - default
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: schedule_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-schedule_db}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-${POSTGRES_USER:-postgres}}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: schedule_nginx_exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://frontend:8081/stub_status
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  postgres_data:
